<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantitative Backtest Terminal (Nautilus Trader)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #070b14;
        --bg-surface: #0c1222;
        --bg-card: #111a2e;
        --bg-card-hover: #16223b;
        --border-subtle: #1e293b;
        --border-focus: #38bdf8;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --color-sky: #38bdf8;
        --color-emerald: #10b981;
        --color-rose: #f43f5e;
        --color-amber: #f59e0b;
        --color-purple: #a855f7;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Custom Modern Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0b1120;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }

      /* Keyframes */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.05); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* UI Component Classes */
      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(51, 65, 85, 0.6);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      .kpi-card {
        background: linear-gradient(135deg, rgba(17, 26, 46, 0.9) 0%, rgba(12, 18, 34, 0.95) 100%);
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 14px 16px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .kpi-card:hover {
        border-color: rgba(56, 189, 248, 0.4);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        transform: translateY(-2px);
      }
      .tab-btn {
        transition: all 0.15s ease-in-out;
      }
      .tab-btn:hover {
        filter: brightness(1.15);
      }
      .custom-input {
        background-color: #090e1a !important;
        border: 1px solid #1e293b !important;
        color: #f8fafc !important;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .custom-input:focus {
        border-color: #38bdf8 !important;
        outline: none;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
